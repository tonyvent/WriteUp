name: Windows build and core regression checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build app/WriteUp/WriteUp.csproj -c Release
      - run: dotnet run --project app/WriteUp.CoreTests -c Release
