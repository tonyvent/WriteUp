name: Windows build and core regression checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build app/WriteUp/WriteUp.csproj -c Release
      - run: dotnet run --project app/WriteUp.CoreTests -c Release
      - run: dotnet run --project app/WriteUp.WindowsTests -c Release
        timeout-minutes: 3

      - name: Build registered Windows offline speech app
        shell: powershell
        run: ./app/build-windows-app.ps1 -OutputPath artifacts/WindowsApp
      - name: Validate Windows package manifest
        shell: powershell
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/makeappx.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $makeappx) { throw "Windows SDK packaging tool unavailable" }
          & $makeappx.FullName pack /d artifacts/WindowsApp /p artifacts/WriteUp-validation.msix /o
          if ($LASTEXITCODE -ne 0) { throw "Package validation failed" }
      - name: Test registered speech runtime activation
        timeout-minutes: 2
        shell: powershell
        run: |
          # This is an isolated hosted test runner, not the user's Windows PC.
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
          $layout = (Resolve-Path artifacts/WindowsApp).Path
          $probeStart = Get-Date
          $process = Start-Process (Join-Path $layout 'WriteUp.exe') -ArgumentList '--speech-runtime-test' -Wait -PassThru
          Write-Host "Probe launcher exit code: $($process.ExitCode)"
          $resultPath = Join-Path $layout 'speech-runtime-test.json'
          for ($i = 0; $i -lt 30 -and -not (Test-Path $resultPath); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $resultPath)) {
            $diagnostic = Join-Path $env:APPDATA 'WriteUp/speech-error.txt'
            if (Test-Path $diagnostic) { Get-Content $diagnostic }
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $probeStart } -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('.NET Runtime', 'Application Error') } |
              ForEach-Object { Write-Host $_.Message }
            throw 'Registered speech runtime did not produce a result'
          }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if (-not $result.success) { throw $result.error }
          Remove-Item $resultPath -Force
          Write-Host "PASS registered Windows AI speech runtime: $($result.identity), readiness $($result.readiness)"
      - uses: actions/upload-artifact@v4
        with:
          name: WriteUp-0.5.8-Windows-Offline-Speech
          path: artifacts/WindowsApp/
